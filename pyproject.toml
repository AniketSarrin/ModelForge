[build-system]
requires = ["setuptools>=68","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelforge-research"
version = "3.0.0"
description = "Visual neural-network research workbench"
requires-python = ">=3.10"
dependencies = ["torch>=2.2","torchvision>=0.17","fastapi>=0.110","uvicorn[standard]>=0.29","pydantic>=2.6","python-multipart>=0.0.9","safetensors>=0.4.5","onnx>=1.16","pillow","pandas>=2.2","pyarrow>=16.0"]

[project.optional-dependencies]
transformers = ["transformers>=4.45","accelerate>=0.34"]
notebook = ["ipython>=8","ipywidgets>=8"]
aws = ["boto3>=1.35"]

[tool.setuptools.packages.find]
include=["modelforge*"]

[project.scripts]
modelforge = "modelforge.cli:main"
